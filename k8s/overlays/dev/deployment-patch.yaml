# Dev settings for every Deployment: 1 replica, Development environment (/health and
# /alive are mapped only in Development by MapDefaultEndpoints()), HTTP probes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: catalog
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
