# ordering: Deployment + ClusterIP Service. Environment-specific settings (replicas,
# ASPNETCORE_ENVIRONMENT, probes, limits) are added by the overlays.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering
  labels:
    app.kubernetes.io/name: ordering
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ordering
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ordering
    spec:
      containers:
        - name: ordering
          # Imported into the cluster with "k3d image import", never pulled from a registry.
          image: ecommerce/ordering:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Service discovery: same variables as docker-compose.yml, resolved by AddServiceDiscovery().
            - name: services__catalog__http__0
              value: http://catalog:8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: ordering
  labels:
    app.kubernetes.io/name: ordering
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ordering
  ports:
    - name: http
      port: 8080
      targetPort: http
